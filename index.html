<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agartracker – ägartrend (Avanza & Nordnet)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1216;
    --card: #171b21;
    --text: #e8eaed;
    --muted: #8b94a3;
    --avanza: #ff3b30;
    --nordnet: #34c9eb;
    --accent: #2ecc71;
    --border: #262b33;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 48px;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 1.4rem; font-weight: 600; margin: 0 0 4px; }
  .subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 16px; }

  .stock-tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  .stock-tabs button {
    background: var(--card); border: 1px solid var(--border);
    padding: 10px 16px; border-radius: 12px; cursor: pointer; transition: all 0.15s ease;
    display: flex; align-items: center; justify-content: center;
  }
  .stock-tabs button img {
    height: 32px; width: auto; max-width: 130px;
    object-fit: contain;
    background: #fff; border-radius: 4px; padding: 4px;
  }
  .stock-tabs button:hover { border-color: var(--muted); }
  .stock-tabs button.active { border-color: var(--text); background: #1d2229; }

  .company-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 18px; margin-bottom: 16px; }
  .company-card .desc { font-size: 0.85rem; color: var(--muted); line-height: 1.4; margin: 0 0 6px; }
  .company-card a { color: var(--nordnet); font-size: 0.82rem; text-decoration: none; }
  .company-card a:hover { text-decoration: underline; }

  .stats { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 18px; flex: 1; min-width: 140px; }
  .stat-card .label { color: var(--muted); font-size: 0.8rem; margin-bottom: 4px; }
  .stat-card .value { font-size: 1.6rem; font-weight: 700; }
  .stat-card .diff { font-size: 0.85rem; margin-top: 2px; }
  .diff.up { color: var(--accent); }
  .diff.down { color: var(--avanza); }
  .diff.flat { color: var(--muted); }
  .stat-card .sublabel { color: var(--muted); font-size: 0.75rem; margin-top: 2px; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .range-buttons { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .range-buttons button {
    background: transparent; border: 1px solid var(--border); color: var(--text);
    padding: 6px 14px; border-radius: 999px; font-size: 0.85rem; cursor: pointer; transition: all 0.15s ease;
  }
  .range-buttons button:hover { border-color: var(--muted); }
  .range-buttons button.active { background: var(--text); color: var(--bg); border-color: var(--text); }
  canvas { max-height: 420px; }
  .empty { text-align: center; color: var(--muted); padding: 60px 20px; }
  footer { text-align: center; color: var(--muted); font-size: 0.75rem; margin-top: 24px; }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="pageTitle">Agartracker</h1>
  <div class="subtitle">Avanza & Nordnet, uppdateras dagligen</div>

  <div class="stock-tabs" id="stockTabs"></div>

  <div class="company-card" id="companyCard"></div>

  <div class="stats" id="stats"></div>
  <div class="stats" id="statsExtra" style="margin-top:-8px;"></div>

  <div class="card">
    <div class="range-buttons" id="rangeButtons">
      <button data-range="1w">Vecka</button>
      <button data-range="1m">1 mån</button>
      <button data-range="3m">3 mån</button>
      <button data-range="6m">6 mån</button>
      <button data-range="1y">1 år</button>
      <button data-range="3y">3 år</button>
      <button data-range="all" class="active">Allt</button>
    </div>
    <div id="chartHolder">
      <canvas id="ownerChart"></canvas>
    </div>
    <div id="emptyState" class="empty" style="display:none;">
      Ingen historik ännu – kommer synas här efter första körningen av trackern.
    </div>
  </div>

  <footer>Data hämtad automatiskt från Avanza och Nordnets (via allaaktier.se) publika aktiesidor.</footer>
</div>

<script>
const STOCKS = [
  {
    key: "ossdsign", name: "OssDsign",
    logo: "https://www.ossdsign.com/upl/images/944269/ossdsign-rgb-guidelines.svg",
    blurb: "Nanosyntetiskt bengraft för ryggradsfusion",
    desc: "Utvecklar och marknadsför ortobiologiska produkter som stödjer kroppens egen läkning – bland annat OssDsign Catalyst, ett syntetiskt bengraft för ryggradsfusion. Grundat 2011, huvudkontor i Uppsala.",
    mfn: "https://mfn.se/all/a/ossdsign",
  },
  {
    key: "smarteye", name: "Smart Eye",
    logo: "https://smarteye.se/wp-content/uploads/2022/06/smarteye-logo.png",
    blurb: "AI för förarövervakning & beteendeforskning",
    desc: "Ledande inom \"Human Insight AI\" – teknik som tolkar och förutspår mänskligt beteende, bland annat via eye-tracking i fordon (förarövervakning) och beteendeforskning genom dotterbolagen Affectiva och iMotions. Grundat 1999, huvudkontor i Sverige.",
    mfn: "https://mfn.se/all/a/smart-eye",
  },
  {
    key: "integrum", name: "Integrum",
    logo: "https://integrum.se/wp-content/themes/integrum/dist/img/integrum.png",
    blurb: "Skelettförankrade proteser för amputerade",
    desc: "Medicinteknikbolag som utvecklar skelettförankrade proteser baserat på OPRA-implantatsystemet, sålt till sjukhus världen över för patienter med amputationer. Grundat 1998, huvudkontor i Mölndal.",
    mfn: "https://mfn.se/all/a/integrum",
  },
];

let currentStock = STOCKS[0].key;
let fullData = [];
let currentRange = "all";
let chart = null;

function daysAgo(n) {
  const d = new Date();
  d.setDate(d.getDate() - n);
  return d;
}

function filterByRange(data, range) {
  if (range === "all") return data;
  const cutoff = { "1w": 7, "1m": 30, "3m": 91, "6m": 182, "1y": 365, "3y": 1095 }[range];
  const cutoffDate = daysAgo(cutoff);
  return data.filter(d => new Date(d.date) >= cutoffDate);
}

function renderStockTabs() {
  const el = document.getElementById("stockTabs");
  el.innerHTML = STOCKS.map(s =>
    `<button data-key="${s.key}" class="${s.key === currentStock ? 'active' : ''}" title="${s.name}">
      <img src="${s.logo}" alt="${s.name}" onerror="this.outerHTML='${s.name}'">
    </button>`
  ).join("");
  el.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => {
      currentStock = btn.dataset.key;
      renderStockTabs();
      loadStock(currentStock);
    });
  });
}

function renderStats(data) {
  const statsEl = document.getElementById("stats");
  const statsExtraEl = document.getElementById("statsExtra");
  if (data.length === 0) { statsEl.innerHTML = ""; statsExtraEl.innerHTML = ""; return; }

  const latest = data[data.length - 1];
  const prev = data.length > 1 ? data[data.length - 2] : null;
  const first = data[0];

  function diffLine(curr, prevVal) {
    if (prevVal === null || prevVal === 0) return "";
    const diff = curr - prevVal;
    const pct = (diff / prevVal * 100);
    const cls = diff > 0 ? "up" : diff < 0 ? "down" : "flat";
    const sign = diff > 0 ? "+" : "";
    const pctSign = pct > 0 ? "+" : "";
    return `<div class="diff ${cls}">${sign}${diff} (${pctSign}${pct.toFixed(1)}%) sen igår</div>`;
  }

  function card(label, value, diff, sublabel) {
    return `<div class="stat-card">
      <div class="label">${label}</div>
      <div class="value">${typeof value === "number" ? value.toLocaleString("sv-SE") : value}</div>
      ${diff || ""}
      ${sublabel ? `<div class="sublabel">${sublabel}</div>` : ""}
    </div>`;
  }

  const totalNow = latest.avanza + latest.nordnet;
  const totalPrev = prev ? prev.avanza + prev.nordnet : null;
  const totalStart = first.avanza + first.nordnet;

  statsEl.innerHTML =
    card("Avanza", latest.avanza, diffLine(latest.avanza, prev ? prev.avanza : null)) +
    card("Nordnet", latest.nordnet, diffLine(latest.nordnet, prev ? prev.nordnet : null)) +
    card("Totalt", totalNow, diffLine(totalNow, totalPrev)) +
    card("Sen start", totalNow - totalStart >= 0 ? "+" + (totalNow - totalStart) : (totalNow - totalStart), "");

  function recordFor(key) {
    let best = data[0];
    for (const d of data) if (d[key] > best[key]) best = d;
    return best;
  }
  const recAvanza = recordFor("avanza");
  const recNordnet = recordFor("nordnet");

  let streak = 0;
  for (let i = data.length - 1; i > 0; i--) {
    const currTotal = data[i].avanza + data[i].nordnet;
    const prevTotal = data[i - 1].avanza + data[i - 1].nordnet;
    if (currTotal > prevTotal) streak++;
    else break;
  }

  const ratio = latest.nordnet > 0 ? (latest.avanza / latest.nordnet) : null;

  statsExtraEl.innerHTML =
    card("Rekord Avanza", recAvanza.avanza, "", recAvanza.date) +
    card("Rekord Nordnet", recNordnet.nordnet, "", recNordnet.date) +
    card("Streak", streak > 0 ? streak + " dagar" : "–", "", streak > 0 ? "i rad med ökning" : "ingen just nu") +
    card("Ratio", ratio !== null ? ratio.toFixed(2) : "–", "", "Avanza per Nordnet-ägare");
}

function renderChart(range) {
  currentRange = range;
  const data = filterByRange(fullData, range);
  const labels = data.map(d => d.date);
  const avanzaData = data.map(d => d.avanza);
  const nordnetData = data.map(d => d.nordnet);

  if (chart) chart.destroy();
  const ctx = document.getElementById("ownerChart").getContext("2d");
  chart = new Chart(ctx, {
    type: "line",
    data: {
      labels,
      datasets: [
        { label: "Avanza", data: avanzaData, borderColor: "#ff3b30", backgroundColor: "rgba(255,59,48,0.08)", tension: 0.25, fill: true, pointRadius: data.length > 60 ? 0 : 2 },
        { label: "Nordnet", data: nordnetData, borderColor: "#34c9eb", backgroundColor: "rgba(52,201,235,0.08)", tension: 0.25, fill: true, pointRadius: data.length > 60 ? 0 : 2 },
      ],
    },
    options: {
      responsive: true,
      interaction: { mode: "index", intersect: false },
      plugins: { legend: { labels: { color: "#e8eaed" } } },
      scales: {
        x: { ticks: { color: "#8b94a3", maxTicksLimit: 8 }, grid: { color: "#262b33" } },
        y: { ticks: { color: "#8b94a3" }, grid: { color: "#262b33" } },
      },
    },
  });
}

document.querySelectorAll("#rangeButtons button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("#rangeButtons button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    renderChart(btn.dataset.range);
  });
});

function renderCompanyCard(stock) {
  const el = document.getElementById("companyCard");
  el.innerHTML = `
    <p class="desc">${stock.desc}</p>
    <a href="${stock.mfn}" target="_blank" rel="noopener">Alla pressmeddelanden & rapporter (MFN.se) →</a>
  `;
}

function loadStock(key) {
  const stock = STOCKS.find(s => s.key === key);
  document.getElementById("pageTitle").textContent = `Agartracker – ${stock.name}`;
  renderCompanyCard(stock);

  fetch(`./data/history_${key}.json?_=` + Date.now())
    .then(r => r.json())
    .then(data => {
      fullData = data;
      if (data.length === 0) {
        document.getElementById("chartHolder").style.display = "none";
        document.getElementById("emptyState").style.display = "block";
        document.getElementById("stats").innerHTML = "";
        document.getElementById("statsExtra").innerHTML = "";
        return;
      }
      document.getElementById("chartHolder").style.display = "block";
      document.getElementById("emptyState").style.display = "none";
      renderStats(data);
      renderChart(currentRange);
    })
    .catch(() => {
      document.getElementById("chartHolder").style.display = "none";
      document.getElementById("emptyState").style.display = "block";
      document.getElementById("emptyState").textContent = `Kunde inte läsa data/history_${key}.json ännu.`;
    });
}

renderStockTabs();
loadStock(currentStock);
</script>
</body>
</html>
