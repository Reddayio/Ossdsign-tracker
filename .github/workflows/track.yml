name: Track OssDsign owners

on:
  # OBS: schemaläggningen sköts INTE längre av GitHubs egna cron (den var
  # opålitlig, ibland flera timmar sen). Istället triggas denna workflow av
  # en extern schemaläggare (cron-job.org) varje kväll kl 20:00 svensk tid,
  # via ett POST-anrop till GitHubs API mot workflow_dispatch nedan.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tracker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CHART_URL: ${{ vars.CHART_URL }}
        run: python track_owners.py

      - name: Commit updated history + Excel-fil
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && echo "Inga ändringar att committa." || git commit -m "Uppdatera ägarhistorik $(date -u +'%Y-%m-%d')"
          git push
